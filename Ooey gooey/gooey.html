<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gooey Effect</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #e0e0e0;
    }

    .navbar {
      background: #333;
      color: #fff;
      padding: 15px;
      text-align: center;
      font-size: 1.2em;
    }

    .wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .stage-wrapper {
      width: 800px;
      height: 600px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      filter: blur(10px) contrast(20);
      overflow: hidden;
    }

    .obj-1, .obj-2 {
      width: 200px;
      height: 200px;
      position: absolute;
      top: 50%;
      background: #000;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    @keyframes move-left-right {
      0% { left: 30%; }
      50% { left: 50%; }
      100% { left: 30%; }
    }

    @keyframes move-right-left {
      0% { left: 70%; }
      50% { left: 50%; }
      100% { left: 70%; }
    }

    .obj-1 {
      left: 30%;
      animation: move-left-right 3s ease infinite;
    }

    .obj-2 {
      left: 70%;
      animation: move-right-left 3s ease infinite;
    }
  </style>
</head>
<body>
  <div class="navbar">
    Gooey Effect with CSS Filter
  </div>
  <div class="wrapper">
    <div class="stage-wrapper">
      <div class="obj-1"></div>
      <div class="obj-2"></div>
    </div>
  </div>
</body>
</html>
